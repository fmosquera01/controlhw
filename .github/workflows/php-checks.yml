name: PHP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Test component comparison
        run: php tests/ComponentComparatorTest.php

      - name: Test inventory hook payload
        run: php tests/InventoryAuditorPayloadTest.php
